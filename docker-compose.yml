services:

  postgres:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28102005
      POSTGRES_DB: auth_service_db
    ports:
      - "5432:5432"
    networks:
      - chat-network

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - chat-network

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - chat-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - chat-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - chat-network

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: always
    ports:
      - "5001:5001"

    depends_on:
      postgres:
        condition: service_started

    networks:
      - chat-network

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: always
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-network

  search-service:
    build:
      context: ./search-service
    container_name: search-service
    restart: always
    ports:
      - "5004:5004"
    networks:
      - chat-network

  message-service:
    build:
      context: ./message-service
    container_name: message-service
    restart: always
    ports:
      - "5003:5003"

    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

    networks:
      - chat-network

  socket-gateway:
    build:
      context: ./socket-gateway
    container_name: socket-gateway
    restart: always
    ports:
      - "5006:5006"

    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

    networks:
      - chat-network

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: always
    ports:
      - "5005:5005"

    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

    networks:
      - chat-network

  nginx:
    image: nginx:latest
    container_name: nginx-load-balancer

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge