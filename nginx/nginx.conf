events {}

http {

    upstream socket_cluster {
        
        server host.docker.internal:5006;
        server host.docker.internal:5007;
        server host.docker.internal:5008;

    }

    server {

        listen 80;

        location /socket.io/ {

            proxy_pass http://socket_cluster;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;

            proxy_read_timeout 86400;

        }

        location /api/auth/ {
            proxy_pass http://host.docker.internal:5001/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users/ {
            proxy_pass http://host.docker.internal:5002/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/search/ {
            proxy_pass http://host.docker.internal:5004/api/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/conversations {
            proxy_pass http://host.docker.internal:5003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/messages {
            proxy_pass http://host.docker.internal:5003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        location / {

            proxy_pass http://socket_cluster;

        }

    }

}