<!DOCTYPE html>
<html>

<head>
    <title>Socket Cluster Test</title>
</head>

<body>

    <h1>Distributed Socket Test</h1>

    <input type="text" id="messageInput" placeholder="Enter message" />

    <button id="sendBtn">
        Send
    </button>

    <ul id="messages"></ul>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
        const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MiwidXNlcm5hbWUiOiJ0ZXN0MiIsImlhdCI6MTc3OTk4NDYzNCwiZXhwIjoxNzgwMDcxMDM0fQ.orNuE4-IiiBMYdB22lTZA6pnje0JqplA2GH1SgV5ZGU";

        const socket = io(
            "http://localhost",
            {
                transports: ["websocket"],
            }
        );

        socket.on("connect", () => {

            console.log(
                "✅ Connected:",
                socket.id
            );
            
            // AUTH SOCKET
            socket.emit(
                "authenticate",
                TOKEN
            );

            socket.emit(
                "join_conversation",
                "room1"
            );

        });

        socket.on(
            "receive_message",
            (data) => {

                console.log(
                    "📩 Received:",
                    data
                );

                const li =
                    document.createElement("li");

                li.innerText =
                    data.content;

                document
                    .getElementById(
                        "messages"
                    )
                    .appendChild(li);

            }
        );

        document
            .getElementById("sendBtn")
            .addEventListener(
                "click",
                () => {

                    const message =
                        document.getElementById(
                            "messageInput"
                        ).value;

                    console.log(
                        "📤 Sending:",
                        message
                    );

                    socket.emit(
                        "send_message",
                        {
                            conversationId:
                                "room1",

                            content:
                                message,
                        }
                    );

                }
            );

    </script>

</body>

</html>
